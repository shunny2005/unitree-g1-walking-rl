# EXP-0040: identical to config/exp0039_push_only_dr.yaml plus motor_strength_range
# enabled (0.7-1.0 torque multiplier, this project's existing established range
# from EXP-0014/21/29) on top of the already-live push randomization. R-0007's
# ablation found motor-strength weakening alone causes 22/60 falls on the
# canonical, undiminished by push-only training (EXP-0039's full-4-factor eval
# still showed 33/60 vs push-only's 20/60), so it is the identified remaining
# factor. Friction/mass stay inert (0-2/60 alone; not needed per the ablation).
# Single conceptual change vs. EXP-0039: motor-strength randomization added.
model_path: assets/g1/scene_walk.xml

sim:
  physics_dt: 0.002
  control_decimation: 10
  episode_seconds: 20.0

action:
  action_scale: 0.25

pd_gains:
  hip_pitch:   {kp: 100, kd: 2}
  hip_roll:    {kp: 100, kd: 2}
  hip_yaw:     {kp: 100, kd: 2}
  knee:        {kp: 150, kd: 4}
  ankle_pitch: {kp: 40,  kd: 2}
  ankle_roll:  {kp: 40,  kd: 2}

command:
  vx_range: [0.0, 0.6]
  vy_range: [-0.2, 0.2]

reward_weights:
  tracking_lin_vel: 1.0
  tracking_sigma: 0.25
  alive_bonus: 0.5
  torque_penalty: 0.0002
  ang_vel_penalty: 0.1
  action_rate_penalty: 0.01
  feet_air_time_bonus: 3.0
  feet_air_time_threshold_s: 0.2
  gait_contact_bonus: 1.0
  feet_swing_height_penalty: 20.0
  feet_swing_height_target_m: 0.08
  contact_foot_vel_penalty: 0.2
  tracking_lin_vel_hard: 2.0
  tracking_hard_scale: 10.0
  heading_deviation_penalty: 0.25

gait_clock:
  enabled: true
  period_s: 0.8
  offset: 0.5
  stance_fraction: 0.55

termination:
  min_pelvis_height_m: 0.5
  min_projected_gravity_z: -0.3

domain_randomization:
  enabled: true
  floor_friction_range: [1.0, 1.0]
  mass_scale_range: [1.0, 1.0]
  motor_strength_range: [0.7, 1.0]
  push_interval_s_range: [3.0, 6.0]
  push_velocity_range: [0.1, 0.5]

ppo:
  algorithm: PPO
  policy: MlpPolicy
  device: cpu
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_net: [256, 256]
  value_net: [256, 256]
