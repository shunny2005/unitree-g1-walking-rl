# EXP-0013: identical to exp0012_air_time.yaml plus a complementary
# stance_overrun_penalty, added after F-0004 found exp0012's
# feet_air_time_bonus alone was gameable -- the policy learned to skate
# (slide feet at ~0.25 m/s while remaining in geometric contact) rather
# than step, since a foot that never leaves the ground never triggers a
# touchdown-only reward.
#
# max_stance_s=1.0: calibrated by measuring exp0011's own (pre-air-time)
# gait's stance-duration distribution (mean 0.21s, median 0.16s, p90
# 0.38s, p99 0.62s, max 2.8s) -- set well above the 99th percentile so
# legitimate occasional long single-support moments aren't penalized,
# while still catching genuinely excessive (multi-second, "never lift")
# stance of the kind exp0012's skating gait exhibited.
# stance_overrun_penalty=2.0: at this threshold, exp0011's own gait
# incurs only ~0.030/step at weight=1.0 (a handful of rare long-stance
# moments) -- weight=2.0 (~0.060/step, ~7.5% of the tracking reward) is a
# meaningful but modest tax, well short of dominating, following the same
# measure-first calibration as feet_air_time_bonus and ang_vel_penalty.
model_path: assets/g1/scene_walk.xml

sim:
  physics_dt: 0.002
  control_decimation: 10
  episode_seconds: 20.0

action:
  action_scale: 0.25

pd_gains:
  hip_pitch:   {kp: 100, kd: 2}
  hip_roll:    {kp: 100, kd: 2}
  hip_yaw:     {kp: 100, kd: 2}
  knee:        {kp: 150, kd: 4}
  ankle_pitch: {kp: 40,  kd: 2}
  ankle_roll:  {kp: 40,  kd: 2}

command:
  vx_range: [0.0, 0.6]
  vy_range: [-0.2, 0.2]

reward_weights:
  tracking_lin_vel: 1.0
  tracking_sigma: 0.25
  alive_bonus: 0.5
  torque_penalty: 0.0002
  ang_vel_penalty: 0.1
  action_rate_penalty: 0.01
  feet_air_time_bonus: 3.0
  feet_air_time_threshold_s: 0.2
  stance_overrun_penalty: 2.0
  max_stance_s: 1.0

termination:
  min_pelvis_height_m: 0.5
  min_projected_gravity_z: -0.3

ppo:
  algorithm: PPO
  policy: MlpPolicy
  device: cpu
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_net: [256, 256]
  value_net: [256, 256]
