# EXP-0011: recalibrated after EXP-0010 collapsed to a near-motionless
# policy (docs/FAILURE_ANALYSIS.md F-0003, experiments/EXPERIMENT_LOG.md
# EXP-0010). Measured exp0009_longer_baseline's actual successful gait's
# yaw-wobble statistics (ang_vel_z^2 mean 0.44) and confirmed EXP-0010's
# ang_vel_penalty=1.0 cost more per step (0.44) than the tracking reward
# it competed with (0.80) -- reduced 10x to 0.1 so the same gait's typical
# cost (~0.044/step, ~5.5% of tracking reward) is a gentle nudge, not a
# wall. action_rate_penalty=0.01 unchanged (measured as a minor
# contributor, mean cost 0.062/step on the same reference gait).
model_path: assets/g1/scene_walk.xml

sim:
  physics_dt: 0.002
  control_decimation: 10
  episode_seconds: 20.0

action:
  action_scale: 0.25

pd_gains:
  hip_pitch:   {kp: 100, kd: 2}
  hip_roll:    {kp: 100, kd: 2}
  hip_yaw:     {kp: 100, kd: 2}
  knee:        {kp: 150, kd: 4}
  ankle_pitch: {kp: 40,  kd: 2}
  ankle_roll:  {kp: 40,  kd: 2}

command:
  vx_range: [0.0, 0.6]
  vy_range: [-0.2, 0.2]

reward_weights:
  tracking_lin_vel: 1.0
  tracking_sigma: 0.25
  alive_bonus: 0.5
  torque_penalty: 0.0002
  ang_vel_penalty: 0.1
  action_rate_penalty: 0.01

termination:
  min_pelvis_height_m: 0.5
  min_projected_gravity_z: -0.3

ppo:
  algorithm: PPO
  policy: MlpPolicy
  device: cpu
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_net: [256, 256]
  value_net: [256, 256]
