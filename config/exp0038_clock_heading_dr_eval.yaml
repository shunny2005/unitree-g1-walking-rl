# Evaluation-only config: exp0038 (clock + heading) under the same randomized physics used by EXP-0021/0029.
# EXP-0038: identical to config/exp0037_gait_clock_hard_tracking.yaml plus
# heading_deviation_penalty 0.25 (the existing term, ADR-010). exp0037's
# remaining deficit is heading at high commanded speed (R-0006): >=0.4 m/s
# episodes drift 43 deg/10 s vs the canonical's 33, straightness 0.851 vs
# 0.909, dist_ratio 0.825 vs 0.899, while speed tracking there is fine (-3%).
# Measured: instantaneous yaw rate is mostly in-stride oscillation (0.57 rad/s
# mean magnitude vs a 0.076 rad/s steady bias), so an instantaneous yaw-rate
# reward (Humanoid-Gym's) would penalize the gait's own swing; heading
# deviation is dominated by accumulated drift (1.12 rad^2/step in the high
# band vs 0.11 elsewhere; in-stride swing contributes about 0.008), so it
# targets the steady component. Weight 0.25 costs about 0.28/step in the high
# band (9% of ~3.1/step) and about 0.03 elsewhere.
model_path: assets/g1/scene_walk.xml

sim:
  physics_dt: 0.002
  control_decimation: 10
  episode_seconds: 20.0

action:
  action_scale: 0.25

pd_gains:
  hip_pitch:   {kp: 100, kd: 2}
  hip_roll:    {kp: 100, kd: 2}
  hip_yaw:     {kp: 100, kd: 2}
  knee:        {kp: 150, kd: 4}
  ankle_pitch: {kp: 40,  kd: 2}
  ankle_roll:  {kp: 40,  kd: 2}

command:
  vx_range: [0.0, 0.6]
  vy_range: [-0.2, 0.2]

reward_weights:
  tracking_lin_vel: 1.0
  tracking_sigma: 0.25
  alive_bonus: 0.5
  torque_penalty: 0.0002
  ang_vel_penalty: 0.1
  action_rate_penalty: 0.01
  feet_air_time_bonus: 3.0
  feet_air_time_threshold_s: 0.2
  gait_contact_bonus: 1.0
  feet_swing_height_penalty: 20.0
  feet_swing_height_target_m: 0.08
  contact_foot_vel_penalty: 0.2
  tracking_lin_vel_hard: 2.0
  tracking_hard_scale: 10.0
  heading_deviation_penalty: 0.25

gait_clock:
  enabled: true
  period_s: 0.8
  offset: 0.5
  stance_fraction: 0.55

termination:
  min_pelvis_height_m: 0.5
  min_projected_gravity_z: -0.3

domain_randomization:
  enabled: true
  floor_friction_range: [0.5, 1.5]
  mass_scale_range: [0.85, 1.15]
  motor_strength_range: [0.7, 1.0]
  push_interval_s_range: [3.0, 6.0]
  push_velocity_range: [0.1, 0.5]

ppo:
  algorithm: PPO
  policy: MlpPolicy
  device: cpu
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_net: [256, 256]
  value_net: [256, 256]
