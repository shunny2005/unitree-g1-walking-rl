# EXP-0033: identical to config/exp0032_reward_annealed_from_scratch.yaml
# plus ONE change: stance_overrun_penalty (EXP-0013's measured weight 2.0 and
# max_stance_s=1.0, calibrated against exp0011's stance-duration distribution)
# is annealed in 0 -> 2.0 over the same first 40% of training, alongside
# feet_air_time_bonus and heading_deviation_penalty. EXP-0032's annealing
# avoided the total standing-still collapse but converged to the F-0004
# skating gait (8M checkpoint: both feet grounded 93% of the time), because
# the touchdown-only feet_air_time_bonus is dodgeable by never lifting a foot.
# stance_overrun_penalty is the targeted fix for that exploit (it accrues
# every step and cannot be dodged); it failed in EXP-0013 at full weight on
# an established policy, and has never been introduced gradually.
model_path: assets/g1/scene_walk.xml

sim:
  physics_dt: 0.002
  control_decimation: 10
  episode_seconds: 20.0

action:
  action_scale: 0.25

pd_gains:
  hip_pitch:   {kp: 100, kd: 2}
  hip_roll:    {kp: 100, kd: 2}
  hip_yaw:     {kp: 100, kd: 2}
  knee:        {kp: 150, kd: 4}
  ankle_pitch: {kp: 40,  kd: 2}
  ankle_roll:  {kp: 40,  kd: 2}

command:
  vx_range: [0.0, 0.6]
  vy_range: [-0.2, 0.2]

reward_weights:
  tracking_lin_vel: 1.0
  tracking_sigma: 0.25
  alive_bonus: 0.5
  torque_penalty: 0.0002
  ang_vel_penalty: 0.1
  action_rate_penalty: 0.01
  feet_air_time_bonus: 0.0
  feet_air_time_threshold_s: 0.2
  heading_deviation_penalty: 0.0
  stance_overrun_penalty: 0.0
  max_stance_s: 1.0

reward_schedule:
  feet_air_time_bonus: {start: 0.0, end: 6.0, end_fraction: 0.4}
  heading_deviation_penalty: {start: 0.0, end: 0.5, end_fraction: 0.4}
  stance_overrun_penalty: {start: 0.0, end: 2.0, end_fraction: 0.4}

termination:
  min_pelvis_height_m: 0.5
  min_projected_gravity_z: -0.3

ppo:
  algorithm: PPO
  policy: MlpPolicy
  device: cpu
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_net: [256, 256]
  value_net: [256, 256]
