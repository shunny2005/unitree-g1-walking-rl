# Canonical config. See config/loader.py for the schema this fills in.
model_path: assets/g1/scene_walk.xml

sim:
  physics_dt: 0.002
  control_decimation: 10   # -> 50 Hz control
  episode_seconds: 20.0

action:
  action_scale: 0.25

# Leg PD gains, one (kp, kd) per joint group, applied to both legs.
# Starting point cited from a sibling project's validated gains for the
# identical robot/actuator setup (docs/RESEARCH_LOG.md R-0003); revisit
# per docs/FAILURE_ANALYSIS.md if evidence says otherwise.
pd_gains:
  hip_pitch:   {kp: 100, kd: 2}
  hip_roll:    {kp: 100, kd: 2}
  hip_yaw:     {kp: 100, kd: 2}
  knee:        {kp: 150, kd: 4}
  ankle_pitch: {kp: 40,  kd: 2}
  ankle_roll:  {kp: 40,  kd: 2}

command:
  vx_range: [0.0, 0.6]     # m/s, forward
  vy_range: [-0.2, 0.2]    # m/s, lateral
  # sampled once per episode at reset (envs/reset.sample_command) -- no
  # mid-episode resampling exists
  # zero_command_prob: fraction of episodes given an exact (0,0) command
  # instead of a uniform draw (default 0.0 -- unchanged legacy behavior).
  # See EXP-0042 / F-0005 in docs/FAILURE_ANALYSIS.md.

# Minimal reward per the challenge doc: velocity tracking + survival +
# torque penalty. Add a term only after naming a measured failure it
# fixes (docs/FAILURE_ANALYSIS.md) -- see docs/DECISIONS.md ADR-002.
reward_weights:
  tracking_lin_vel: 1.0
  tracking_sigma: 0.25
  alive_bonus: 0.5
  torque_penalty: 0.0002

termination:
  min_pelvis_height_m: 0.5
  min_projected_gravity_z: -0.3   # base tilted more than ~72.5 deg from upright (acos(0.3))

ppo:
  algorithm: PPO
  policy: MlpPolicy
  device: cpu
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_net: [256, 256]
  value_net: [256, 256]
