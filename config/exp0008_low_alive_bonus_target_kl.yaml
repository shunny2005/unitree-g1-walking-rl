# EXP-0008 (contingent on EXP-0007's result): combine the two
# independently-tested changes -- reduced alive_bonus (EXP-0007, fixes
# the "cheap survival" incentive) and target_kl (EXP-0006, fixes PPO
# update instability) -- to test whether both are needed together.
# Only run this if EXP-0007 alone still shows meaningful falls or
# instability; if EXP-0007 alone already looks clean, this is not needed.
model_path: assets/g1/scene_walk.xml

sim:
  physics_dt: 0.002
  control_decimation: 10
  episode_seconds: 20.0

action:
  action_scale: 0.25

pd_gains:
  hip_pitch:   {kp: 100, kd: 2}
  hip_roll:    {kp: 100, kd: 2}
  hip_yaw:     {kp: 100, kd: 2}
  knee:        {kp: 150, kd: 4}
  ankle_pitch: {kp: 40,  kd: 2}
  ankle_roll:  {kp: 40,  kd: 2}

command:
  vx_range: [0.0, 0.6]
  vy_range: [-0.2, 0.2]

reward_weights:
  tracking_lin_vel: 1.0
  tracking_sigma: 0.25
  alive_bonus: 0.1
  torque_penalty: 0.0002

termination:
  min_pelvis_height_m: 0.5
  min_projected_gravity_z: -0.3

ppo:
  algorithm: PPO
  policy: MlpPolicy
  device: cpu
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_net: [256, 256]
  value_net: [256, 256]
  target_kl: 0.03
