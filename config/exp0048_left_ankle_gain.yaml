# EXP-0048: identical to config/exp0047_ankle_gain_more_zerocmd.yaml
# (canonical) except the LEFT leg's ankle_pitch/ankle_roll kp/kd are raised
# further, via the new `pd_gains_left` override (config/loader.py,
# control/pd_controller.build_asymmetric_gains). `pd_gains` (applying to the
# right leg) is unchanged from the canonical (kp=60, kd=3).
#
# Every checkpoint measured this session (exp0043 baseline, exp0045, exp0046,
# exp0047 -- 4 independently-trained configurations spanning different PD
# gains, reward weights, and zero-command exposure) shows the SAME pattern:
# left-foot swing duration shorter than right's, never once reversed. Model
# mass/inertia/actuator-forcerange/sagittal-joint-range were checked directly
# and are symmetric between legs. The left foot's swing duration also has a
# hard ceiling not seen on the right (1127 left swings across 20 episodes on
# the canonical: max 140ms; 1080 right swings: max 180ms) -- consistent with
# a real, structural constraint, not just "less often long."
#
# This tests whether MORE targeted control authority specifically for the
# left leg (kp 60->90, kd 3->4.5, a 50% increase matching the magnitude of
# the canonical's own bilateral kp increase in EXP-0047) closes the gap --
# discriminating "still control-rate limited, just needed more for this
# specific leg" from "capped by something other than ankle PD response"
# (the gait clock's left-phase-leads structural convention being the leading
# alternative hypothesis, `envs/gait.py`'s `clock_features`).
# See experiments/EXPERIMENT_LOG.md EXP-0048 for the full pre-registration.
model_path: assets/g1/scene_walk.xml

sim:
  physics_dt: 0.002
  control_decimation: 10
  episode_seconds: 20.0

action:
  action_scale: 0.25

pd_gains:
  hip_pitch:   {kp: 100, kd: 2}
  hip_roll:    {kp: 100, kd: 2}
  hip_yaw:     {kp: 100, kd: 2}
  knee:        {kp: 150, kd: 4}
  ankle_pitch: {kp: 60,  kd: 3}
  ankle_roll:  {kp: 60,  kd: 3}

pd_gains_left:
  hip_pitch:   {kp: 100, kd: 2}
  hip_roll:    {kp: 100, kd: 2}
  hip_yaw:     {kp: 100, kd: 2}
  knee:        {kp: 150, kd: 4}
  ankle_pitch: {kp: 90,  kd: 4.5}
  ankle_roll:  {kp: 90,  kd: 4.5}

command:
  vx_range: [0.0, 0.6]
  vy_range: [-0.2, 0.2]
  zero_command_prob: 0.30

reward_weights:
  tracking_lin_vel: 1.0
  tracking_sigma: 0.25
  alive_bonus: 0.5
  torque_penalty: 0.0002
  ang_vel_penalty: 0.1
  action_rate_penalty: 0.01
  feet_air_time_bonus: 3.0
  feet_air_time_threshold_s: 0.2
  gait_contact_bonus: 1.0
  feet_swing_height_penalty: 20.0
  feet_swing_height_target_m: 0.08
  contact_foot_vel_penalty: 0.2
  tracking_lin_vel_hard: 2.0
  tracking_hard_scale: 10.0
  heading_deviation_penalty: 1.0

gait_clock:
  enabled: true
  period_s: 0.8
  offset: 0.5
  stance_fraction: 0.55

termination:
  min_pelvis_height_m: 0.5
  min_projected_gravity_z: -0.3

ppo:
  algorithm: PPO
  policy: MlpPolicy
  device: cpu
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_net: [256, 256]
  value_net: [256, 256]
