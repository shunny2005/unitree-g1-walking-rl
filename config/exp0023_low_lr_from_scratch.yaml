# EXP-0023: byte-for-byte identical to config/default.yaml (the exact
# config behind baseline0001/exp0009 -- minimal reward, no air-time/
# heading terms) except one field: ppo.learning_rate lowered from the
# standard 3.0e-4 to 5.0e-5, the exact rate this project has used for
# every warm-start fine-tune (EXP-0016/17/19/20/21). Single conceptual
# change: learning rate only, still random initialization (no
# --init-from). Isolates whether low LR *by itself* is why fine-tuning
# runs never show the climb-crash-recover PPO oscillation (F-0002), or
# whether it's specific to fine-tuning from an already-competent policy
# (as EXP-0022 suggested for a much richer reward, at standard LR, from
# scratch -- but that conflated reward complexity with initialization).
model_path: assets/g1/scene_walk.xml

sim:
  physics_dt: 0.002
  control_decimation: 10
  episode_seconds: 20.0

action:
  action_scale: 0.25

pd_gains:
  hip_pitch:   {kp: 100, kd: 2}
  hip_roll:    {kp: 100, kd: 2}
  hip_yaw:     {kp: 100, kd: 2}
  knee:        {kp: 150, kd: 4}
  ankle_pitch: {kp: 40,  kd: 2}
  ankle_roll:  {kp: 40,  kd: 2}

command:
  vx_range: [0.0, 0.6]
  vy_range: [-0.2, 0.2]

reward_weights:
  tracking_lin_vel: 1.0
  tracking_sigma: 0.25
  alive_bonus: 0.5
  torque_penalty: 0.0002

termination:
  min_pelvis_height_m: 0.5
  min_projected_gravity_z: -0.3

ppo:
  algorithm: PPO
  policy: MlpPolicy
  device: cpu
  learning_rate: 5.0e-5
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_net: [256, 256]
  value_net: [256, 256]
