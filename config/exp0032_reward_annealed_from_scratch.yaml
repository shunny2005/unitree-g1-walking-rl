# EXP-0032: identical to config/exp0022_full_curriculum_from_scratch.yaml
# (exp0019's exact final reward weights: feet_air_time_bonus=6.0,
# heading_deviation_penalty=0.5, standard learning_rate=3e-4, random init)
# EXCEPT feet_air_time_bonus and heading_deviation_penalty are annealed in
# gradually via reward_schedule instead of being present, at full weight,
# from step 0. Single conceptual change vs. EXP-0022: annealing schedule
# only -- same final weights, same LR, same random init, same reward
# family. Base gait-quality terms (tracking_lin_vel, alive_bonus,
# torque_penalty, ang_vel_penalty, action_rate_penalty) stay present from
# step 0 unchanged, since EXP-0009/0011 already proved these are safe to
# train from scratch on their own.
#
# Both new terms ramp 0 -> full value linearly over the first 40% of
# training, then hold at full value -- giving the policy time to first
# learn real forward locomotion under simple tracking pressure (as
# EXP-0009/0011 did) before the stepping/heading complexity is introduced,
# without needing a separate fine-tuning run/checkpoint at all.
model_path: assets/g1/scene_walk.xml

sim:
  physics_dt: 0.002
  control_decimation: 10
  episode_seconds: 20.0

action:
  action_scale: 0.25

pd_gains:
  hip_pitch:   {kp: 100, kd: 2}
  hip_roll:    {kp: 100, kd: 2}
  hip_yaw:     {kp: 100, kd: 2}
  knee:        {kp: 150, kd: 4}
  ankle_pitch: {kp: 40,  kd: 2}
  ankle_roll:  {kp: 40,  kd: 2}

command:
  vx_range: [0.0, 0.6]
  vy_range: [-0.2, 0.2]

reward_weights:
  tracking_lin_vel: 1.0
  tracking_sigma: 0.25
  alive_bonus: 0.5
  torque_penalty: 0.0002
  ang_vel_penalty: 0.1
  action_rate_penalty: 0.01
  feet_air_time_bonus: 0.0
  feet_air_time_threshold_s: 0.2
  heading_deviation_penalty: 0.0

reward_schedule:
  feet_air_time_bonus: {start: 0.0, end: 6.0, end_fraction: 0.4}
  heading_deviation_penalty: {start: 0.0, end: 0.5, end_fraction: 0.4}

termination:
  min_pelvis_height_m: 0.5
  min_projected_gravity_z: -0.3

ppo:
  algorithm: PPO
  policy: MlpPolicy
  device: cpu
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_net: [256, 256]
  value_net: [256, 256]
