# EXP-0012: identical to exp0011_gait_quality_v2.yaml (the config behind
# the current canonical baseline) plus one new reward term motivated by a
# measured failure (docs/FAILURE_ANALYSIS.md F-0004): the canonical
# policy's swing phases are extremely short (median 20ms, 90th percentile
# 40ms -- measured directly on exp0011's checkpoint via
# envs.contacts.AirTimeTracker), an order of magnitude below a deliberate
# stride.
#
# feet_air_time_threshold_s=0.2: a modest target swing duration (200ms),
# well above the current ~20-40ms but not an aggressively long stride.
# feet_air_time_bonus=3.0: calibrated by replaying exp0011's own gait
# through this reward offline (see experiments/EXPERIMENT_LOG.md EXP-0012)
# -- at weight=1.0 the current gait's shortfall costs only ~0.029/step
# (negligible next to the ~0.8/step tracking reward); weight=3.0 raises
# that to ~0.086/step (~11% of tracking), a meaningful but not dominant
# nudge, following the ADR-005 measure-first discipline (not a repeat of
# EXP-0010's "same order as another term" guess).
model_path: assets/g1/scene_walk.xml

sim:
  physics_dt: 0.002
  control_decimation: 10
  episode_seconds: 20.0

action:
  action_scale: 0.25

pd_gains:
  hip_pitch:   {kp: 100, kd: 2}
  hip_roll:    {kp: 100, kd: 2}
  hip_yaw:     {kp: 100, kd: 2}
  knee:        {kp: 150, kd: 4}
  ankle_pitch: {kp: 40,  kd: 2}
  ankle_roll:  {kp: 40,  kd: 2}

command:
  vx_range: [0.0, 0.6]
  vy_range: [-0.2, 0.2]

reward_weights:
  tracking_lin_vel: 1.0
  tracking_sigma: 0.25
  alive_bonus: 0.5
  torque_penalty: 0.0002
  ang_vel_penalty: 0.1
  action_rate_penalty: 0.01
  feet_air_time_bonus: 3.0
  feet_air_time_threshold_s: 0.2

termination:
  min_pelvis_height_m: 0.5
  min_projected_gravity_z: -0.3

ppo:
  algorithm: PPO
  policy: MlpPolicy
  device: cpu
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_net: [256, 256]
  value_net: [256, 256]
