# EXP-0041: identical to config/exp0038_clock_heading.yaml except
# heading_deviation_penalty 0.25 -> 1.0. F-0005 found the canonical spins
# +19 to +26 deg/20s at a zero command (never sampled during training), and
# that this term's raw cost there (0.0715 rad^2/step) is smaller than the
# low-speed-band cost (0.106) the SAME weight already controls well during
# normal walking (R-0006) -- at 0.25 it is only 0.4% of the policy's
# ~4.18/step reward at zero command, far too weak a signal. Weight 1.0
# (measured: 1.7% of reward at zero command) is a moderate step up, matched
# in order of magnitude to what already works elsewhere in this reward,
# not the more aggressive weight (~5) a literal extrapolation would suggest,
# given this lineage's demonstrated fragility to large new pressure
# (EXP-0027/0028).
model_path: assets/g1/scene_walk.xml

sim:
  physics_dt: 0.002
  control_decimation: 10
  episode_seconds: 20.0

action:
  action_scale: 0.25

pd_gains:
  hip_pitch:   {kp: 100, kd: 2}
  hip_roll:    {kp: 100, kd: 2}
  hip_yaw:     {kp: 100, kd: 2}
  knee:        {kp: 150, kd: 4}
  ankle_pitch: {kp: 40,  kd: 2}
  ankle_roll:  {kp: 40,  kd: 2}

command:
  vx_range: [0.0, 0.6]
  vy_range: [-0.2, 0.2]

reward_weights:
  tracking_lin_vel: 1.0
  tracking_sigma: 0.25
  alive_bonus: 0.5
  torque_penalty: 0.0002
  ang_vel_penalty: 0.1
  action_rate_penalty: 0.01
  feet_air_time_bonus: 3.0
  feet_air_time_threshold_s: 0.2
  gait_contact_bonus: 1.0
  feet_swing_height_penalty: 20.0
  feet_swing_height_target_m: 0.08
  contact_foot_vel_penalty: 0.2
  tracking_lin_vel_hard: 2.0
  tracking_hard_scale: 10.0
  heading_deviation_penalty: 1.0

gait_clock:
  enabled: true
  period_s: 0.8
  offset: 0.5
  stance_fraction: 0.55

termination:
  min_pelvis_height_m: 0.5
  min_projected_gravity_z: -0.3

ppo:
  algorithm: PPO
  policy: MlpPolicy
  device: cpu
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_net: [256, 256]
  value_net: [256, 256]
